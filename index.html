<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#101319; --surface:#191D26; --surface-2:#212734; --line:#2A303C;
  --txt:#F5F7FB; --dim:#A9B1C2;
  --amber:#F2B33D; --amber-deep:#C98A12;
  --barato:#3FC46B; --normal:#4E8FF5; --caro:#E5484D;
  --interes:#F2B33D; --noche:#A98BF5; --fiesta:#E85D9C; --gaycol:#7ED6A5;
  --familia:#5EC8E8; --aventura:#F2934D; --aviso:#E5484D;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

header{padding:22px 0 6px;text-align:center}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--amber);margin-bottom:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,6.5vw,34px);line-height:1.05}
h1 em{font-style:normal;color:var(--amber)}
.lede{color:var(--dim);font-size:14.5px;margin-top:8px}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-top:16px}
.tab{padding:11px 6px;border-radius:12px;cursor:pointer;text-align:center;
  font-family:var(--display);font-size:12.5px;font-weight:700;line-height:1.2;
  color:var(--dim);background:var(--surface);border:1px solid var(--line);transition:all .16s}
.tab svg{display:block;width:19px;height:19px;margin:0 auto 5px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--ground);background:var(--amber);border-color:var(--amber)}

.zonabar{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.zonabar::-webkit-scrollbar{display:none}
.zb{flex:0 0 auto;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  font-family:var(--display);font-size:12.5px;font-weight:700;
  color:var(--dim);background:var(--surface);border:1px solid var(--line)}
.zb.on{color:var(--ground);background:var(--amber);border-color:var(--amber)}

#mapa{height:62vh;min-height:420px;border-radius:16px;margin-top:14px;
  border:1px solid var(--line);background:var(--surface)}
.leaflet-container{background:#eef2f5;font-family:var(--body)}
.leaflet-popup-content-wrapper{background:var(--surface-2);color:var(--txt);border-radius:12px}
.leaflet-popup-tip{background:var(--surface-2)}
.leaflet-popup-content{margin:12px 14px;font-size:14px}
.leaflet-popup-content .pn{font-family:var(--display);font-weight:800;font-size:15.5px;margin-bottom:3px}
.leaflet-popup-content .pd{color:var(--dim);font-size:12.5px;margin-bottom:9px;line-height:1.45}
.leaflet-popup-content a.pg{display:block;text-align:center;padding:9px;border-radius:9px;
  background:var(--amber);color:var(--ground);font-family:var(--display);font-weight:700;
  font-size:13px;text-decoration:none;margin-bottom:6px}
.leaflet-popup-content button.pc{display:block;width:100%;padding:8px;border-radius:9px;
  background:var(--surface);color:var(--dim);border:1px solid var(--line);cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:12px}
.leaflet-popup-content button.pc.ok{background:var(--barato);color:var(--ground);border-color:var(--barato)}
.leaflet-control-attribution{background:transparent!important;color:#8a9099!important;font-size:8px!important;padding:0 3px!important;opacity:.55}
.leaflet-control-attribution a{color:var(--dim)!important}

.marca{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:11px;color:#101319;
  border:2px solid rgba(16,19,25,.9);box-shadow:0 1px 5px rgba(0,0,0,.5)}

.leyenda{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.leyenda span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--dim)}
.leyenda i{width:10px;height:10px;border-radius:50%}

.aviso-vacio{margin-top:14px;padding:16px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);text-align:center;color:var(--dim);font-size:14px}
.oculto{display:none!important}
footer{margin:34px 0 40px;padding-top:18px;border-top:1px solid var(--line);
  text-align:center;color:var(--dim);font-size:13px}
footer .sig{font-family:var(--display);font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;font-size:11px;color:var(--amber);margin-top:6px}
</style>
</head>

var capa = L.layerGroup().addTo(mapa);

function icono(color, num){
  return L.divIcon({
    className:'', iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-13],
    html:'<div class="marca" style="background:'+color+'">'+num+'</div>'
  });
}

function copiar(txt, boton){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.select();
  var ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(txt); ok=true; }
  boton.classList.add('ok'); boton.textContent = ok ? '¡Copiado!' : 'Mantén pulsado';
  setTimeout(function(){ boton.classList.remove('ok'); boton.textContent='Copiar enlace'; },1700);
}

function pintar(){
  capa.clearLayers();
  var n = 0;
  SITIOS.forEach(function(s){
    if(activas.indexOf(s.p) === -1) return;
    n++;
    var col = COLORES[s.p] ? COLORES[s.p].c : '#F2B33D';
    var url = 'https://maps.google.com/?q=' + encodeURIComponent(s.g);
    var m = L.marker([s.lat, s.lon], { icon: icono(col, n), title: s.n }).addTo(capa);
    var div = document.createElement('div');
    div.innerHTML = '<div class="pn">'+s.n+'</div><div class="pd">'+s.t+' · '+s.z+'<br>'+s.d+'</div>'+
      '<a class="pg" href="'+url+'" target="_blank" rel="noopener">Abrir en Google Maps</a>'+
      '<button class="pc">Copiar enlace</button>';
    div.querySelector('.pc').addEventListener('click', function(){ copiar(url, this); });
    m.bindPopup(div, { maxWidth:280 });
  });

  var h=''; activas.forEach(function(f){ if(COLORES[f]) h+='<span><i style="background:'+COLORES[f].c+'"></i>'+COLORES[f].n+'</span>'; });
  document.getElementById('leyenda').innerHTML = h;

  var vacio = document.getElementById('vacio');
  if(pestana === ''){
    vacio.textContent = 'Elige arriba qué quieres ver.';
    vacio.classList.remove('oculto');
  } else if(activas.length === 0){
    vacio.textContent = 'Esta categoría todavía está vacía. Se irá rellenando.';
    vacio.classList.remove('oculto');
  } else {
    vacio.classList.add('oculto');
  }
}

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    pestana = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(o){ o.setAttribute('aria-selected', o===t ? 'true':'false'); });
    activas = (TABS[pestana]||[]).slice();
    pintar();
    var pts = SITIOS.filter(function(s){ return activas.indexOf(s.p)!==-1; });
    if(pts.length) mapa.fitBounds(L.latLngBounds(pts.map(function(s){ return [s.lat,s.lon]; })), {padding:[40,40], maxZoom:15});
  });
});

var zonabar = document.getElementById('zonabar');
ZONAS.forEach(function(z){
  var b = document.createElement('button');
  b.className='zb'; b.textContent = z.corto; b.dataset.zona = z.id;
  b.addEventListener('click', function(){
    document.querySelectorAll('.zb').forEach(function(o){ o.classList.toggle('on', o===b); });
    mapa.fitBounds([[z.lat0,z.lon0],[z.lat1,z.lon1]], {padding:[20,20]});
  });
  zonabar.appendChild(b);
});

todo.className='zb on'; todo.textContent='Toda Barcelona';
